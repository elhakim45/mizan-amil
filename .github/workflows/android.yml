name: Build APK Android

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSI: 1.0.${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK sudah terpasang di runner ubuntu-latest; cukup terima lisensinya
      # agar Gradle boleh mengunduh komponen yang kurang.
      - name: Terima lisensi Android SDK
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Pasang Capacitor
        run: npm install --no-audit --no-fund

      - name: Buat proyek Android
        run: npx cap add android

      - name: Ikon & splash dari logo HES
        continue-on-error: true
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'
          --splashBackgroundColor '#2B1C78' --splashBackgroundColorDark '#2B1C78'

      - name: Salin web app ke Android
        run: npx cap sync android

      # versionCode harus naik di setiap build agar APK baru bisa menimpa yang lama.
      - name: Atur nomor versi
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSI\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle

      - name: Tentukan jenis build
        id: mode
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Kunci tanda tangan ditemukan: membangun APK rilis bertanda tangan."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Secret KEYSTORE_BASE64 belum diisi: membangun APK debug."
          fi

      - name: Build APK debug
        if: steps.mode.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../MizanAmil-v$VERSI.apk"

      - name: Build dan tanda tangani APK rilis
        if: steps.mode.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew scripts/sign-apk.sh
          (cd android && ./gradlew assembleRelease --no-daemon)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mizan-amil.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/mizan-amil.jks" scripts/sign-apk.sh \
            android/app/build/outputs/apk/release/app-release-unsigned.apk "MizanAmil-v$VERSI.apk"
          rm -f "$RUNNER_TEMP/mizan-amil.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MizanAmil-apk
          path: MizanAmil-*.apk

      - name: Terbitkan rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSI }}
          name: Mizan Amil v${{ env.VERSI }}
          files: MizanAmil-*.apk
          body: |
            APK Android Mizan Amil — media pembelajaran Hukum Zakat, Prodi Hukum Ekonomi Syariah FAI UMS.
            Unduh berkas .apk di bawah, buka di ponsel Android, lalu izinkan "Instal dari sumber tidak dikenal".
            ${{ steps.mode.outputs.signed == 'true' && 'APK ini sudah ditandatangani (rilis) dan dapat diperbarui di atas versi bertanda tangan yang sama.' || 'APK ini versi debug (belum ditandatangani dengan kunci rilis).' }}
