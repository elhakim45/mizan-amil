name: Terbitkan web app (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/ambil-harga.mjs'
      - 'scripts/harga-parse.mjs'
      - '.github/workflows/pages.yml'
  # Harga emas & perak Antam diperbarui tiap pagi (sekitar 08.30-09.30 WIB).
  # Situs diterbitkan ulang dengan harga terbaru pada 09.40 dan 12.00 WIB.
  schedule:
    - cron: '40 2 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cadangan: bila pengambilan hari ini gagal, harga terakhir yang pernah terbit tetap dipakai.
      - name: Ambil harga.json terakhir yang sudah terbit
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/harga.json"
          if curl -fsS --max-time 20 "$URL" -o "$RUNNER_TEMP/harga-lama.json"; then
            cp "$RUNNER_TEMP/harga-lama.json" www/harga.json
            echo "Harga lama dipulihkan:"; cat www/harga.json
          else
            echo "Belum ada harga.json sebelumnya."
          fi

      - name: Ambil harga terbaru dari situs Antam
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core
          node scripts/ambil-harga.mjs www/harga.json

      - name: Tampilkan harga.json yang akan terbit
        run: cat www/harga.json || echo "(tidak ada harga.json)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
